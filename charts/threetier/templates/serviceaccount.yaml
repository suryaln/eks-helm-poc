{{- if .Values.irsa.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "irsa.roleArn is required" .Values.irsa.roleArn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
{{- end }}
