{{- if .Values.irsa.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "irsa.roleArn is required" .Values.irsa.roleArn | quote }}
    regional-endpoints: "true" # Instructs the AWS SDK inside the container to speak to the local regional 
#AWS STS endpoint rather than the global endpoint This reduces network latency and avoids cross-region dependencies.
{{- end }}
