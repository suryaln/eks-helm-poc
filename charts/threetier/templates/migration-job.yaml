{{- if and .Values.migration.enabled .Values.api.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migrate
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ .Values.migration.image }}
          env:
            - name: DB_HOST
              value: {{ .Values.api.dbHost | default (print .Release.Name "-database") | quote }}
          command: ["sh", "-c"]
          args:
            - |
              echo "[migrate] release={{ .Release.Name }} revision={{ .Release.Revision }} target=$DB_HOST"
              echo "[migrate] applying 001_init.sql ..."; sleep 3
              echo "[migrate] applying 002_add_users.sql ..."; sleep 3
              echo "[migrate] done"
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
{{- end }}
