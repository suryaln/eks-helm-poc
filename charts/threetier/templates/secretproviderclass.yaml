{{- if .Values.secretsManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "common.spcName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secretsManager.region | quote }}
    objects: |
      - objectName: {{ required "secretsManager.secretName is required" .Values.secretsManager.secretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: dbusername
          - path: password
            objectAlias: dbpassword
  # Mirrors the Secrets Manager values into a K8s Secret (created when a pod mounts the CSI volume)
  secretObjects:
    - secretName: {{ include "common.dbSecretName" . }}
      type: Opaque
      data:
        - {objectName: dbusername, key: username}
        - {objectName: dbpassword, key: password}
{{- end }}
