apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: helm-poc
  region: us-east-1
  version: "1.31"          # use a currently supported EKS version
iam:
  withOIDC: true           # required for IRSA
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'   # makes NetworkPolicy ENFORCED
    resolveConflicts: overwrite
  - name: aws-ebs-csi-driver                                # needed for PVCs
    wellKnownPolicies: {ebsCSIController: true}
  - name: coredns
  - name: kube-proxy
managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
