apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: helm-poc
  region: us-east-1
  version: "1.36"          # use a currently supported EKS version
iam:
  withOIDC: true           # required for IRSA
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'   # makes NetworkPolicy ENFORCED
    resolveConflicts: overwrite
  - name: aws-ebs-csi-driver                                # needed for PVCs
    wellKnownPolicies: {ebsCSIController: true}
  - name: coredns
  - name: kube-proxy
managedNodeGroups:
  - name: ng-1
    instanceType: t3.small #because t3.medium is not available in free tier account
    desiredCapacity: 5
    minSize: 4
    maxSize: 6
    volumeSize: 30
